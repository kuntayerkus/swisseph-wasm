name: Release

# Sürüm etiketi itildiğinde çalışır: v0.1.0, v1.2.3 …
#
# Yayın, TÜM kontroller ve testler geçmeden yapılmaz. Bu kütüphanenin tek
# değer önermesi sayıların doğru olması; doğrulanmamış bir sürüm yayınlamak
# o önermeyi geçersiz kılar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Yayınlamadan sadece doğrula'
        type: boolean
        default: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Ucuz ön kontrol: etiket ile paket sürümü tutmuyorsa on dakikalık
      # derlemeye hiç girmeyelim. Tam denetim aşağıda, ağaç tamamlandıktan
      # sonra. Burada check-release-ready ÇAĞRILAMAZ — o betik artefaktları
      # ve veri paketlerini de arıyor, ikisi de bu noktada henüz yok.
      - name: Etiket sürümü paketlerle uyuşuyor mu (ön kontrol)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(node -e "console.log(require('./packages/core/package.json').version)")
          test "$want" = "$got" \
            || (echo "::error::etiket $GITHUB_REF_NAME ama paket sürümü $got" && exit 1)

      - run: npm run build

      # `git diff` değil snapshot + diff — gerekçe ci.yml'deki aynı adımda.
      # Özetle: konteyner işinde checkout'un safe.directory'si geçici, sonraki
      # adımda git repoyu tanımıyor ve kontrol yanlış sebeple düşüyor.
      - name: Üretilmiş sabitler güncel mi
        run: |
          cp -r packages/core/src/generated "$RUNNER_TEMP/generated-before"
          npm run build:constants
          diff -r "$RUNNER_TEMP/generated-before" packages/core/src/generated \
            || (echo "::error::generated/constants.ts bayat" && exit 1)

      - name: Efemeris dosyalarını getir
        run: |
          mkdir -p /tmp/ephe
          base=https://raw.githubusercontent.com/aloistr/swisseph/master/ephe
          for f in sepl_12.se1 semo_12.se1 seas_12.se1 \
                   sepl_18.se1 semo_18.se1 seas_18.se1 \
                   sepl_24.se1 semo_24.se1 seas_24.se1 \
                   sefstars.txt seorbel.txt; do
            curl -fsSL --retry 3 -o "/tmp/ephe/$f" "$base/$f"
          done

      - name: Veri paketlerini kur
        env:
          SWISSEPH_EPHE_PATH: /tmp/ephe
        run: |
          npm run build:data
          npm run build:asteroids

      # Tam yayın denetimi — ağaç ancak BURADA yayınlanacak haliyle eksiksiz:
      # WASM derlendi, dist/ üretildi, iki veri paketi kuruldu.
      #
      # Bu adım eskiden `npm ci`nin hemen ardındaydı ve orada geçmesi mümkün
      # değildi: betik packages/core/wasm, packages/core/dist, packages/mcp/dist
      # ve packages/{data,asteroids}/ephe arıyor, hiçbiri o noktada mevcut
      # olmuyor. v0.1.0 etiketi tam olarak böyle düştü — yedi "artefakt eksik"
      # sorunu, sürümlerde tek bir uyuşmazlık olmadan.
      #
      # Etiket yokken sürüm argümanı VERİLMİYOR: workflow_dispatch'te
      # GITHUB_REF_NAME "main" olur ve beklenen sürüm diye "main" geçilirse
      # denetim anlamsızca düşer. Argümansız çağrı private bayraklarını,
      # artefaktları ve manifest hash'lerini yine de doğruluyor — kuru
      # çalıştırmanın gerçek bir prova olması için gereken buydu. Eskiden bu
      # adım etiketle sınırlıydı, dolayısıyla kuru çalıştırma yeşil verirken
      # asıl etiket koşusu düşebiliyordu; olan da buydu.
      - name: Yayın denetimi
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node tools/check-release-ready.mjs "${GITHUB_REF_NAME#v}"
          else
            node tools/check-release-ready.mjs
          fi

      - name: Tüm kontroller
        env:
          SWISSEPH_EPHE_PATH: /tmp/ephe
        run: npm run check

      - name: Testler
        run: npm test

      - name: Yayınlanacak içeriği listele
        run: |
          for pkg in core data asteroids mcp; do
            echo "--- packages/$pkg ---"
            npm pack --dry-run --workspace "./packages/$pkg" 2>&1 | tail -30
          done

      # MCP'nin dist/'i de buraya giriyor: publish işi yalnızca bu artefaktı
      # indiriyor, yeniden derlemiyor. Listede olmayan bir paket boş dist ile
      # yayınlanır ve bunu ancak kullanıcı fark eder.
      - name: Artefaktları sakla
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            packages/core/wasm/
            packages/core/dist/
            packages/data/
            packages/asteroids/
            packages/mcp/dist/
          retention-days: 30

  publish:
    name: Publish to npm
    needs: verify
    # Yalnızca etiket itildiğinde ve manuel çalıştırmada dryRun kapalıysa.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dryRun != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance için OIDC
    # Onay kapısı. Bu ad, repo ayarlarındaki environment adıyla HARFİ HARFİNE
    # aynı olmalı. Eşleşmezse GitHub sessizce o adda korumasız yeni bir
    # environment yaratır ve yayın onaysız gider — kapı kurulmuş görünür ama
    # yoktur. Burada tam olarak bu oldu: ayarlarda `npm_publish` tanımlıydı,
    # burada `npm-publish` yazıyordu.
    environment: npm_publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v7
        with:
          name: release-build
          path: packages/

      - run: npm ci --ignore-scripts

      # Sıra önemli: core önce, veri paketleri ona atıf yapıyor. MCP sunucusu
      # core'a tam sürümle bağlı olduğu için en sonda.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace ./packages/core --provenance --access public
          npm publish --workspace ./packages/data --provenance --access public
          npm publish --workspace ./packages/asteroids --provenance --access public
          npm publish --workspace ./packages/mcp --provenance --access public
